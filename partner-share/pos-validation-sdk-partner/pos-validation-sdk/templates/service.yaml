apiVersion: v1
kind: Service
metadata:
  name: {{ include "pos-validation-sdk.fullname" . }}
  labels:
    {{- include "pos-validation-sdk.labels" . | nindent 4 }}
  {{- if .Values.backendConfig.enabled }}
  annotations:
    cloud.google.com/backend-config: '{"default": "{{ include "pos-validation-sdk.fullname" . }}-backendconfig"}'
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pos-validation-sdk.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
